plugins {
    id("net.fabricmc.fabric-loom") version "1.17.19"
    id("me.modmuss50.mod-publish-plugin") version "2.2.0"
}

group = "me.wechirok"
String release_version = System.getenv("RENICE_SHOT_VERSION")
String minecraft_version = providers.gradleProperty("minecraft_version").get()
version = release_version ?: providers.gradleProperty("mod_version").get()

String mod_version = version.toString()
String release_tag = mod_version.replace("+", "%2B")
String minecraft_dependency = providers.gradleProperty("minecraft_dependency").get()
String curseforge_minecraft_version = System.getenv("CURSEFORGE_MINECRAFT_VERSION")?.trim()
        ?: providers.gradleProperty('curseforge_minecraft_version').get()

repositories {
    maven {
        name = "TerraformersMC"
        url = uri("https://maven.terraformersmc.com/releases/")

        content {
            includeGroup("com.terraformersmc")
        }
    }

    maven {
        name = "shedaniel"
        url = uri("https://maven.shedaniel.me/")

        content {
            includeGroup("me.shedaniel.cloth")
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:0.19.5")

    implementation("net.fabricmc.fabric-api:fabric-api:${providers.gradleProperty('fabric_api_version').get()}")
    compileOnly("com.terraformersmc:modmenu:${providers.gradleProperty('modmenu_version').get()}")
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${providers.gradleProperty('cloth_config_version').get()}")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs.add("-Xlint:deprecation")
}

processResources {
    inputs.property("version", mod_version)
    inputs.property("minecraft_version", minecraft_version)
    inputs.property("minecraft_dependency", minecraft_dependency)

    from("LICENSE")

    filesMatching("fabric.mod.json") {
        expand(
                "version": mod_version,
                "minecraft_version": minecraft_version,
                "minecraft_dependency": minecraft_dependency
        )
    }
}

publishMods {
    displayName = "Renice Shot ${project.version}"
    changelog = "View changelog at [the release page](https://github.com/wechirok/renice-shot/releases/tag/${release_tag})."
    dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").orElse("false").get().toBoolean()

    type = STABLE

    file = jar.archiveFile
    modLoaders.add("fabric")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1655703"
        minecraftVersions.add(curseforge_minecraft_version)
        requires("fabric-api")
        optional("modmenu")
        optional("cloth-config")
        client = true
        server = false
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "ZDCwiIc3"
        minecraftVersions.addAll(providers.gradleProperty('modrinth_minecraft_versions').get().split(','))
        requires {
            id = "P7dR8mSH"
        }
        optional {
            id = "mOgUt4GM"
        }
        optional {
            id = "9s6osm5g"
        }
    }
}
