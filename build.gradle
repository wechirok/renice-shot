plugins {
    id("net.fabricmc.fabric-loom") version "1.17.19"
    id("me.modmuss50.mod-publish-plugin") version "2.2.0"
}

group = "me.wechirok"
version = System.getenv("RENICE_SHOT_VERSION") ?: "1.1.0+mc26.3-rc-3"

String mod_version = version.toString()
String release_tag = mod_version.replace("+", "%2B")
String minecraft_version = "26.3-rc-3"
String minecraft_dependency = "26.3-rc.3"
String curseforge_minecraft_version = minecraft_version.contains("-") ? "${minecraft_version.substring(0, minecraft_version.indexOf('-'))}-snapshot" : minecraft_version

repositories {
    maven {
        name = "TerraformersMC"
        url = uri("https://maven.terraformersmc.com/releases/")

        content {
            includeGroup("com.terraformersmc")
        }
    }

    maven {
        name = "shedaniel"
        url = uri("https://maven.shedaniel.me/")

        content {
            includeGroup("me.shedaniel.cloth")
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:0.19.5")

    implementation("net.fabricmc.fabric-api:fabric-api:0.160.3+26.3")
    implementation("com.terraformersmc:modmenu:21.0.0-alpha.1")
    implementation("me.shedaniel.cloth:cloth-config-fabric:26.2.155")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs.add("-Xlint:deprecation")
}

processResources {
    inputs.property("version", mod_version)
    inputs.property("minecraft_version", minecraft_version)
    inputs.property("minecraft_dependency", minecraft_dependency)

    from("LICENSE")

    filesMatching("fabric.mod.json") {
        expand(
                "version": mod_version,
                "minecraft_version": minecraft_version,
                "minecraft_dependency": minecraft_dependency
        )
    }
}

publishMods {
    displayName = "Renice Shot ${project.version}"
    changelog = "View changelog at [the release page](https://github.com/wechirok/renice-shot/releases/tag/${release_tag})."
    dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").orElse("false").get().toBoolean()

    if (mod_version.contains("alpha")) {
        type = ALPHA
    } else if (mod_version.contains("beta") || mod_version.contains("rc")) {
        type = BETA
    } else {
        type = STABLE
    }

    file = jar.archiveFile
    modLoaders.add("fabric")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1655703"
        minecraftVersions.add(curseforge_minecraft_version)
        requires("fabric-api")
        optional("modmenu")
        optional("cloth-config")
        client = true
        server = false
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "ZDCwiIc3"
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
        optional("modmenu")
        optional("cloth-config")
    }
}
