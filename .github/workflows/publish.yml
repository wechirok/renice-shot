name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      target:
        description: Publishing target
        required: true
        default: all
        type: choice
        options:
          - all
          - github
          - modrinth
          - curseforge
      curseforge_minecraft_version:
        description: CurseForge Minecraft version override
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          cache-disabled: true
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build
        env:
          RENICE_SHOT_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Upload GitHub release artifact
        if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'github'
        run: gh release upload "$RELEASE_TAG" "build/libs/renice-shot-$RELEASE_TAG.jar" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Upload to CurseForge
        if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'curseforge'
        run: ./gradlew publishCurseforge
        env:
          RENICE_SHOT_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          CURSEFORGE_MINECRAFT_VERSION: ${{ inputs.curseforge_minecraft_version }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - name: Upload to Modrinth
        if: github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'modrinth'
        run: ./gradlew publishModrinth
        env:
          RENICE_SHOT_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
